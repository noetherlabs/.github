<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Noether Labs</title>
  <meta name="description" content="Research in optical sensing and control.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 32px; background: #f6f7f5; color: #171c1a; display: grid; place-items: center; font: 16px/1.6 system-ui, -apple-system, sans-serif; }
    main { width: min(100%, 650px); padding: clamp(28px, 6vw, 58px); background: #fff; border: 1px solid #e2e6e2; border-radius: 12px; }
    h1 { margin: 0 0 20px; font-size: clamp(32px, 7vw, 52px); font-weight: 600; line-height: 1.1; letter-spacing: -0.045em; }
    p { max-width: 46ch; color: #4b5750; }
    a { color: #285447; text-underline-offset: 4px; }
    nav { margin-top: 36px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
  </style>
  <script>
    // Optional destination; update this value without changing the public URL.
    const DESTINATION_URL = "";
    if (/^https:\/\//i.test(DESTINATION_URL)) {
      location.replace(DESTINATION_URL);
    }
  </script>
</head>
<body>
  <main>
    <h1>Noether Labs</h1>
    <p>Research in optical sensing, estimation and closed-loop control.</p>
    <nav>
      <a href="https://github.com/noetherlabs/noether-ao">Noether AO</a>
      <a href="https://github.com/noetherlabs/probebench">ProbeBench</a>
    </nav>
  </main>
</body>
</html>
